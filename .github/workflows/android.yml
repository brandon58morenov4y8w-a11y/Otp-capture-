: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        mkdir -p app/src/main/java/com/example/otp_app
        mkdir -p app/src/main
        
        # যদি ফাইলগুলো রুট ডিরেক্টরিতে থাকে তবে সেগুলোকে সঠিক ফোল্ডারে সরিয়ে নেওয়া
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f SmsReceiver.java ] && mv SmsReceiver.java app/src/main/java/com/example/otp_app/
        [ -f build.gradle ] && mv build.gradle app/
        [ -f settings.gradle ] && echo "settings.gradle exists" || echo "include ':app'" > settings.gradle
        
        # বিল্ড কমান্ড চালানো
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          # গ্রেডল র‍্যাপার না থাকলে নিজে তৈরি করে বিল্ড করা
          gradle wrapper
          ./gradlew assembleDebug
