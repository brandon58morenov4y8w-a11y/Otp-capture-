name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Create Android project
      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          echo "Creating Android project..."

          mkdir -p app/src/main/java/com/example/otp_app
          mkdir -p app/src/main/res/values

          # -----------------------------------------
          # Move existing AndroidManifest
          # -----------------------------------------
          if [ -f "AndroidManifest.xml" ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # -----------------------------------------
          # Move SmsReceiver.java if it exists
          # -----------------------------------------
          if [ -f "SmsReceiver.java" ]; then
            mv SmsReceiver.java app/src/main/java/com/example/otp_app/SmsReceiver.java
          fi

          # -----------------------------------------
          # AndroidX configuration
          # -----------------------------------------
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # -----------------------------------------
          # settings.gradle
          # -----------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "otp_app"

          include(":app")
          EOF

          # -----------------------------------------
          # Root build.gradle
          # -----------------------------------------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # -----------------------------------------
          # App build.gradle
          # -----------------------------------------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.otp_app'

              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.otp_app'

                  minSdk 21
                  targetSdk 34

                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          # -----------------------------------------
          # Create styles.xml
          # -----------------------------------------
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.DarkActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

          # -----------------------------------------
          # Create MainActivity if missing
          # -----------------------------------------
          if [ ! -f "app/src/main/java/com/example/otp_app/MainActivity.java" ]; then

            cat > app/src/main/java/com/example/otp_app/MainActivity.java <<'EOF'
          package com.example.otp_app;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(android.R.layout.simple_list_item_1);
              }
          }
          EOF

          fi

          # -----------------------------------------
          # Create AndroidManifest if missing
          # -----------------------------------------
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then

            cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="OTP App"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          fi

          echo "Android project created successfully."

      # 5. Generate Gradle wrapper
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7

      # 6. Build APK
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otp-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
