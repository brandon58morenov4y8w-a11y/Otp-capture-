name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Complete Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/otp_app
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
        [ -f SmsReceiver.java ] && mv SmsReceiver.java app/src/main/java/com/example/otp_app/ || true
        
        # রুট লেভেলে সঠিক build.gradle তৈরি করা যদি না থাকে
        if [ ! -f "build.gradle" ]; then
          echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
        fi

        # app ফোল্ডারের ভেতরে build.gradle তৈরি বা নিশ্চিত করা
        mkdir -p app
        if [ -f "app/build.gradle" ]; then
          echo "app/build.gradle exists"
        else
          cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.otp_app'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.otp_app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF
        fi

        # settings.gradle নিশ্চিত করা
        echo "include ':app'" > settings.gradle

        # গ্রেডল র‍্যাপার তৈরি করে বিল্ড রান করা
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug
        
